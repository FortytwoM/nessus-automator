worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1024m;

    upstream nessus_ui {
        server nessus:8834;
    }

    upstream nessus_manage {
        server nessus:8080;
    }

    server {
        listen 8834 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Operator API (plugin update, hold, scan gate)
        location /manage/ {
            proxy_pass http://nessus_manage;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-ApiKeys $http_x_apikeys;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # Nessus UI + standard Nessus REST API
        location / {
            proxy_pass https://nessus_ui;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            # Nessus sends HSTS; with a self-signed gateway cert Firefox blocks exceptions
            proxy_hide_header Strict-Transport-Security;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
}
