worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size __GATEWAY_MAX_BODY_SIZE__;
    __NGINX_RESOLVER__

    server {
        listen __GATEWAY_BIND_IP__:8834 ssl;
        server_name _;
        include /etc/nginx/gateway-allow.conf;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;

        # Operator API (plugin update, hold, scan gate)
        location /manage/ {
            set $nessus_manage __NESSUS_MANAGE_HOST__:__NESSUS_MANAGE_PORT__;
            proxy_pass http://$nessus_manage;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-ApiKeys $http_x_apikeys;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # Nessus UI + standard Nessus REST API
        location / {
            set $nessus_ui __NESSUS_BACKEND_HOST__:__NESSUS_BACKEND_PORT__;
            proxy_pass https://$nessus_ui;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
}
