services:
  nessus:
    build: .
    container_name: nessus
    restart: always
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    network_mode: host
    cap_add:
      - NET_RAW
      - LINUX_IMMUTABLE
    volumes:
      - nessus_data:/opt/nessus
      - ./packages:/mnt/nessus:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: ${NESSUS_HEALTH_START_PERIOD:-1800}s

  gateway:
    build: ./gateway
    container_name: nessus-gateway
    restart: always
    depends_on:
      nessus:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "--no-check-certificate", "https://localhost:8834/manage/v1/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: ${NESSUS_HEALTH_START_PERIOD:-1800}s

volumes:
  nessus_data:
